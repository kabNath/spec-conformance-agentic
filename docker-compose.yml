# Self-hosted stack: `docker compose up` on a clean machine.
#
# Network layout (checked by scripts/test-network-isolation.sh, run in CI):
#   edge      the only network with a published port: the app (3000)
#   internal  `internal: true`, no route in or out of the host: Postgres, Qdrant, Neo4j and the signing sidecar live here only.
#             The sidecar publishes NO port and is reachable by the app and nothing else.
# The app is on both networks (it must reach the model provider on the internet).
#
# First start: the sidecar generates its own signing key into a named volume and keeps it. Its attestations are then
# valid (integrity) but its key is not listed in vidimus-svc/trusted-keys.json (signer_trusted=false). To sign with your
# own key use docker-compose.prod.yml (docs/SELF_HOSTING.md). Local development with published ports:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres qdrant neo4j vidimus
name: sca

x-internal-only: &internal_only
  networks: [internal]

services:
  app:
    image: spec-conformance-app:local
    build: { context: ., target: runner }
    ports: ["3000:3000"]
    networks: [edge, internal]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/conformance
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme-neo4j}
      VIDIMUS_URL: http://vidimus:4319
    depends_on:
      migrate: { condition: service_completed_successfully }
      vidimus: { condition: service_healthy }
    restart: unless-stopped

  migrate:
    image: spec-conformance-migrate:local
    build: { context: ., target: migrate }
    <<: *internal_only
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/conformance
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  vidimus:
    image: vidimus-svc:local
    build: { context: ., dockerfile: vidimus-svc/Dockerfile }
    <<: *internal_only
    # no `ports:` on purpose
    environment:
      VIDIMUS_KEYS_DIR: /data/vidimus-keys
      VIDIMUS_ALLOW_EPHEMERAL: "1"   # generate the key on first start, then reuse it from the volume
    volumes: ["vidimuskeys:/data/vidimus-keys"]
    restart: unless-stopped

  postgres:
    image: postgres:16
    <<: *internal_only
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: conformance
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d conformance"], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    <<: *internal_only
    volumes: ["qdrantdata:/qdrant/storage"]
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    <<: *internal_only
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme-neo4j}
    volumes: ["neo4jdata:/data"]
    restart: unless-stopped

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata:
  qdrantdata:
  neo4jdata:
  vidimuskeys:
