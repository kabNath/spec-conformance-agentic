# Self-managed Postgres 16 on a volume. Private only (Flycast, TCP). Daily logical backup to Tigris: ops/backup.
app = "sca-nk-db"
primary_region = "nrt"
kill_signal = "SIGINT"       # Postgres "fast shutdown"
kill_timeout = "30s"

[build]
  dockerfile = "postgres.Dockerfile"   # relative to this file

[env]
  PGDATA = "/var/lib/postgresql/data/pgdata"
  POSTGRES_DB = "conformance"
  # secret: POSTGRES_PASSWORD

[[mounts]]
  source = "pgdata"
  destination = "/var/lib/postgresql/data"
  initial_size = "3gb"

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[services.ports]]
    port = 5432
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
