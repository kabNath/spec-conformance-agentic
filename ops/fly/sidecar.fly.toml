# Signing sidecar. NO public IP: deploy with --no-public-ips and give it a private Flycast address only (ops/fly/deploy.sh).
# Stops after a few idle minutes, starts on the first request that arrives through its Flycast address.
app = "sca-nk-sidecar"
primary_region = "nrt"

[env]
  VIDIMUS_ALLOW_EPHEMERAL = "0"                                   # never generate a key in production
  VIDIMUS_SIGNING_KEY_FILE = "/run/secrets/vidimus_signing_key"   # the file below, from a Fly secret

[[files]]
  guest_path = "/run/secrets/vidimus_signing_key"
  secret_name = "VIDIMUS_SIGNING_KEY_B64"                          # base64 of the PEM; Fly writes the decoded bytes to the file

[http_service]
  internal_port = 4319
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
